<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Excel Diff Viewer</title>
  <style>
    table { border-collapse: collapse; margin-top: 20px; }
    td, th { border: 1px solid black; padding: 5px; text-align: center; position: relative; }
    .different { background-color: #f99; }
    td:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      top: -30px;
      left: 0;
      background: #333;
      color: #fff;
      padding: 5px;
      font-size: 12px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 10;
    }
  </style>
</head>
<body>
  <h1>Compare Two Excels (Only Highlights Differences)</h1>
  <input type="file" id="file1" accept=".xlsx, .xls"/>
  <input type="file" id="file2" accept=".xlsx, .xls"/>
  <button onclick="compareExcels()">Compare</button>
  <div id="output"></div>

  <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
  <script>
    let data1, data2;

    document.getElementById('file1').addEventListener('change', (e) => {
      readExcel(e.target.files[0], (data) => data1 = data);
    });

    document.getElementById('file2').addEventListener('change', (e) => {
      readExcel(e.target.files[0], (data) => data2 = data);
    });

    function readExcel(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const workbook = XLSX.read(e.target.result, { type: 'binary' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const data = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        callback(data);
      };
      reader.readAsBinaryString(file);
    }

    function compareExcels() {
      if (!data1 || !data2) {
        alert('Upload both files first!');
        return;
      }

      const maxRows = Math.max(data1.length, data2.length);
      const maxCols = Math.max(
        ...data1.map(row => row.length),
        ...data2.map(row => row.length)
      );

      let table = '<table><thead><tr><th></th>';
      for (let c = 0; c < maxCols; c++) {
        table += `<th>Col ${c+1}</th>`;
      }
      table += '</tr></thead><tbody>';

      for (let r = 0; r < maxRows; r++) {
        table += `<tr><th>Row ${r+1}</th>`;
        for (let c = 0; c < maxCols; c++) {
          const val1 = (data1[r] && data1[r][c]) || '';
          const val2 = (data2[r] && data2[r][c]) || '';
          const isDifferent = val1 !== val2;

          table += `<td class="${isDifferent ? 'different' : ''}" ${isDifferent ? `data-tooltip="Old: ${val1} | New: ${val2}"` : ''}>${val1}</td>`;
        }
        table += '</tr>';
      }

      table += '</tbody></table>';
      document.getElementById('output').innerHTML = table;
    }
  </script>
</body>
</html>
